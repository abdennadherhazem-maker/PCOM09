    "httpx[socks]>=0.27,<1",
    "numpy>=1.24,<3",
    "scikit-learn>=1.3,<2",
    "threadpoolctl>=3.1,<4",
    "lightgbm==4.6.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pandas>=2,<4",
    "requests>=2.31,<3",
]
